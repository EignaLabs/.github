<text x="640" y="217" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Independent checks</text>
<text x="640" y="244" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Quality and safety</text>
<text x="640" y="271" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Keep failures visible</text>
<path d="M875 236 H896 l-7 -7 m7 7 l-7 7" fill="none" stroke="#087e8b" stroke-width="3"/>
