<text x="68" y="182" fill="#162b3a" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700">Collector</text>
<text x="68" y="217" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Authorized sources</text>
<text x="68" y="244" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Consent and lineage</text>
<text x="68" y="271" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Client-controlled data</text>
