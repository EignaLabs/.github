<text x="926" y="182" fill="#162b3a" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700">Promotion guard</text>
<text x="926" y="217" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Promote only if better</text>
<text x="926" y="244" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Retain rollback history</text>
<text x="926" y="271" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Continue from feedback</text>
<text x="48" y="380" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400">Development-stage software. Real-client quality and production acceptance remain unverified.</text>
