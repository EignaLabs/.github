<text x="354" y="217" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Small specialist models</text>
<text x="354" y="244" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Approved learning inputs</text>
<text x="354" y="271" fill="#43596c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Retain the current model</text>
